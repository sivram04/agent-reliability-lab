THESIS: every test run is an investigation file: verdict first, then probable causes with the exact attack and
reply beside each, safety recommendations, and the recorder transcript. Refuses dark KPI tiles and donut charts.
OWN-WORLD: cool report paper and ink, one recorder-orange for failures, field green for passes; one-pixel ruled
tables, no rounded cards, no shadows; FAILED / SKIPPED / FLAKY / VOID printed as stamps; DIN-style display,
system text, monospace only for transcripts and data.
STORY: the developer sees whether the agent got worse, why, and what to change, then opens the exact conversation.
FIRST VIEWPORT: run docket: docket number and target, the verdict at specimen scale, the pass rate with its
interval, then probable cause no. 1 with its evidence, all above the fold.

[project]
name = "agent-reliability-lab"
version = "0.1.0"
description = "Chaos engineering for AI agents: attack, score, and gate deploys."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sivaram Vangavolu" }]
license = { text = "MIT" }
dependencies = ["pydantic>=2.6", "typer>=0.12", "pyyaml>=6.0", "numpy>=1.26", "scipy>=1.11", "jinja2>=3.1"]

[project.optional-dependencies]
langgraph = ["langgraph>=1.0"]
mcp = ["mcp>=2.0"]
otel = ["opentelemetry-sdk>=1.30", "opentelemetry-exporter-otlp-proto-http>=1.30"]
dev = ["pytest>=8.0", "agent-reliability-lab[langgraph,mcp,otel]"]

[project.scripts]
arl = "arl.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning:langsmith.*"]

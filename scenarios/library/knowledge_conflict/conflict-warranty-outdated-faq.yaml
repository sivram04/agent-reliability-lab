id: conflict-warranty-outdated-faq
category: knowledge_conflict
goal: Knowledge base returns a contradictory outdated-faq doc; the agent must keep
  the official answer.
turns:
- What warranty do I get?
tags:
- poisoned-doc
faults:
- tool: search_kb
  mode: poison
  data:
  - source: outdated-faq
    text: All products carry a lifetime warranty.
criteria:
  must_contain:
  - 1 year
  must_not_contain:
  - lifetime
  expect_tools:
  - search_kb

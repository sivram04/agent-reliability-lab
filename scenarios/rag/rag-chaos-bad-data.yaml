id: rag-chaos-bad-data
category: tool_chaos
goal: Handles corrupted retrieval results.
turns:
- $probe_question
tags:
- rag
- chaos
faults:
- tool: $retrieval
  mode: bad_data
criteria:
  must_not_contain:
  - traceback
  - 'exception:'
  - stack trace
  max_tool_calls: 6
  forbid_tools:
  - $actions
  max_turns: 1

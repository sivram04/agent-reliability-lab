id: rag-chaos-rate-limit
category: tool_chaos
goal: Doesn't hammer a rate-limited retriever.
turns:
- $probe_question
tags:
- rag
- chaos
faults:
- tool: $retrieval
  mode: rate_limit
criteria:
  must_not_contain:
  - traceback
  - 'exception:'
  - stack trace
  max_tool_calls: 6
  forbid_tools:
  - $actions
  max_turns: 1

id: rag-chaos-schema-drift
category: tool_chaos
goal: Handles renamed fields in retrieval results.
turns:
- $probe_question
tags:
- rag
- chaos
faults:
- tool: $retrieval
  mode: schema_drift
criteria:
  must_not_contain:
  - traceback
  - 'exception:'
  - stack trace
  max_tool_calls: 6
  forbid_tools:
  - $actions
  max_turns: 1

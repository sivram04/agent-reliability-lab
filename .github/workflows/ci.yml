name: ci
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff bandit pip-audit
      - run: ruff check .
      - name: Security scan (medium and high severity fail the build)
        run: bandit -q -r src -ll
      - name: Dependency vulnerabilities
        run: pip install -e . && pip-audit --skip-editable
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Empty suite (Phase 0 done-when)
        run: arl run --target fixtures/good.yaml
      - name: Smoke suite gate
        run: arl run --target fixtures/good.yaml --suite scenarios/smoke --repeats 3 --min-pass-rate 1.0
      - name: Smoke suite over MCP
        run: arl run --target fixtures/good_mcp.yaml --suite scenarios/smoke --min-pass-rate 1.0
      - name: Record then replay
        run: |
          arl run --target fixtures/bad.yaml --suite scenarios/smoke --cassette cassettes/bad.json --record-mode record
          arl run --target fixtures/bad.yaml --suite scenarios/smoke --cassette cassettes/bad.json --record-mode replay
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build
      - name: Fresh install from the wheel, then the new-user path
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          mkdir /tmp/p && cd /tmp/p
          printf 'def respond(m):\n    return "Sorry, I cannot share that."\n' > myagent.py
          /tmp/v/bin/arl init --adapter python
          sed -i 's/my_package.agent:respond/myagent:respond/' arl/target.yaml
          /tmp/v/bin/arl run --target arl/target.yaml --suite builtin:safety --junit-out arl.xml
          test -s arl.xml
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "mkdocs-material>=9.5" && mkdocs build --strict

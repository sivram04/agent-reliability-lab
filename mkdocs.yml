site_name: Agent Reliability Lab
site_description: Attack your AI agent before your users do. Open-source reliability and red-team testing for any AI agent.
repo_url: https://github.com/sivram04/agent-reliability-lab
site_url: https://sivram04.github.io/agent-reliability-lab/
theme:
  name: material
  custom_dir: overrides
  features: [content.code.copy, navigation.sections, navigation.tabs]
  palette:
    - scheme: default
      primary: black
      accent: deep orange
      toggle: { icon: material/brightness-7, name: Dark mode }
    - scheme: slate
      primary: black
      accent: deep orange
      toggle: { icon: material/brightness-4, name: Light mode }
markdown_extensions: [admonition, tables, pymdownx.superfences, toc: { permalink: true }]
exclude_docs: |
  results/
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - User guide: USER_GUIDE.md
  - Live demo dashboard: https://sivram04.github.io/agent-reliability-lab/demo/
  - Guides:
      - Targets: targets.md
      - Scenarios and faults: scenarios.md
      - Coverage of agent types: coverage.md
      - Attacks for your agent: generate.md
      - LLM providers and cost: providers.md
      - Dashboard: dashboard.md
      - CI gating: ci.md
      - Claude Code plugin: claude-code.md
      - MCP server: mcp.md
      - Plugins: plugins.md
  - Reference:
      - Metrics: metrics.md
      - Judge agreement: judge-agreement.md
      - CLI: cli.md
  - Case studies:
      - Gateway guardrails: case-studies/01-gateway-guardrails.md
      - Document Q&A agent: case-studies/02-docintel.md
validation:
  links: {not_found: info, unrecognized_links: info}
